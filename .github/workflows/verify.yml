name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          version: latest-known
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q tests/test_plugin.py tests/test_skill.py tests/test_functional_run.py tests/test_init.py
      - run: uv run tactus --help
      - run: uv build
