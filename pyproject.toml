[project]
name = "tactus"
version = "0.1.0"
description = "An experimental code-first music production framework."
readme = "README.md"
authors = [{ name = "Paul", email = "bernie40916@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "librosa>=0.11",
    "numpy>=1.26",
    "pedalboard>=0.9.25",
    "pyloudnorm>=0.2",
    "pytimestretch",
    "scipy>=1.14",
    "soundfile>=0.13",
]

[project.scripts]
tactus = "tactus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tactus"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
pytimestretch = { git = "https://github.com/openmirlab/pytimestretch", rev = "e43cc6dc000c61715540d5031bb526b4a28f2ee9" }
