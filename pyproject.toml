[project]
name = "tactus"
version = "0.1.0"
description = "Produce music with code. Built for agents."
readme = "README.md"
authors = [{ name = "Paul", email = "bernie40916@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3",
    "numba>=0.67,<0.68",
    "numpy>=1.26",
    "pedalboard>=0.9.26",
    "pyqmdsp",
    "pytimestretch",
    "scipy>=1.14",
    "soundfile>=0.13",
]

[project.optional-dependencies]
librosa = ["librosa==1.0.0"]
serve = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]
mcp = [
    "mcp>=1.26,<2",
]
ableton-visual = [
    "pillow>=10",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-screencapturekit>=12.2.2 ; sys_platform == 'darwin'",
    "windows-capture>=2 ; sys_platform == 'win32'",
]

[project.scripts]
tactus = "tactus.launcher:main"
tactus-mcp = "tactus.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tactus"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src", "tests", "examples", "skills", "design",
    ".claude-plugin", ".codex-plugin", ".agents/plugins",
    "docs/analysis.md", "docs/daw-bridge.md", "docs/design.md", "docs/development.md", "docs/project-commands.md",
    "docs/positioning.md", "README.md", "AGENTS.md", "CLAUDE.md",
    "pyproject.toml", "uv.lock", ".python-version",
]
exclude = [
    "**/.venv/**", "**/__pycache__/**", "**/*.py[cod]",
    "**/.pytest_cache/**", "**/.ruff_cache/**", "**/.tactus/**", "**/.tactus-code/**",
    "/examples/**/runs/**", "/examples/**/inputs/**",
    "/examples/**/measurements/**", "/examples/**/delivery/**",
]

[dependency-groups]
dev = [
    "fastapi>=0.143.0",
    "mcp>=1.26,<2",
    "pytest>=8.3",
    "ruff>=0.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
extend-exclude = [
    ".claude/worktrees",
    "src/tactus/bridges/ableton_support/_vendor",
    "tests/ableton_reference",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real uv sync/install integration test; opt-in via TACTUS_SLOW=1",
    "reference: numerical comparison requiring the optional librosa extra",
    "oracle: behavioral comparison against an installed csound binary; skipped without it",
]

[tool.uv.sources]
pyqmdsp = { git = "https://github.com/openmirlab/pyqmdsp", rev = "09b36d656b347425ba36c1c38ca372b337f0b527" }
pytimestretch = { git = "https://github.com/openmirlab/pytimestretch", rev = "e43cc6dc000c61715540d5031bb526b4a28f2ee9" }
