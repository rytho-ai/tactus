[project]
name = "tactus-code"
version = "0.0.1"
description = "An experimental code-first music production framework."
readme = "README.md"
authors = [{ name = "Paul", email = "bernie40916@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "soundfile>=0.13"]

[project.scripts]
tactus-code = "tactus_code.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tactus_code"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
