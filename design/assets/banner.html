<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tactus banner source</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--surface-canvas);color:var(--text-primary)}
.banner{position:relative;width:1200px;height:400px;overflow:hidden;background:var(--surface-canvas);display:flex;align-items:center;padding:0 74px;gap:30px}
.banner:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 149px,var(--brand-guide) 149px 150px)}
.logo{position:relative;width:152px;height:152px}.lockup{position:relative}
.resonance{position:absolute;inset:0;width:1200px;height:400px;pointer-events:none}
.name{font:500 96px/1 var(--brand-font);letter-spacing:-.055em}
.description{font:400 22px/1.5 var(--brand-font);color:var(--text-code);margin-top:16px;letter-spacing:.01em}
.support{font:400 16px/1.5 var(--brand-font);color:var(--brand-support);margin-top:5px;letter-spacing:.01em}
.beats{position:absolute;bottom:32px;left:74px;right:74px;display:flex;justify-content:space-between;font:400 11px var(--brand-data-font);color:var(--brand-timing)}.beats span:first-child{color:var(--accent-primary)}
</style>
</head>
<body><main class="banner" aria-label="Tactus: Produce music with code. Built for agents. Arrange, render, analyze, and refine.">
<svg class="resonance" viewBox="0 0 1200 400" fill="none" aria-hidden="true">
  <path d="M720 182H1200M1040 0V400" style="stroke:var(--brand-axis)"/>
  <g style="stroke:var(--brand-ring)">
    <circle cx="1040" cy="182" r="98"/>
    <circle cx="1040" cy="182" r="280"/>
    <circle cx="1040" cy="182" r="336"/>
  </g>
  <circle cx="1040" cy="182" r="148" style="stroke:var(--accent-primary)" stroke-width="12" stroke-dasharray="650 280" transform="rotate(-26 1040 182)"/>
  <circle cx="1040" cy="182" r="220" style="stroke:var(--accent-primary)" stroke-opacity=".65" stroke-width="6" stroke-dasharray="905 478" transform="rotate(-5 1040 182)"/>
  <circle cx="1040" cy="182" r="280" style="stroke:var(--audio-color)" stroke-opacity=".5" stroke-dasharray="270 1490" transform="rotate(140 1040 182)"/>
  <circle cx="1040" cy="182" r="15" style="fill:var(--accent-primary)"/>
  <circle cx="784" cy="69" r="4" style="fill:var(--audio-color)"/>
  <circle cx="829" cy="244" r="5" style="fill:var(--accent-primary)"/>
</svg>
<img class="logo" src="tactus-logo.svg" alt="Tactus logo" width="152" height="152">
<div class="lockup"><div class="name">tactus</div><div class="description">Produce music with code. Built for agents.</div><div class="support">Arrange, render, analyze, and refine.</div></div>
<div class="beats" aria-hidden="true"><span>01</span><span>02</span><span>03</span><span>04</span><span>05</span><span>06</span><span>07</span><span>08</span></div>
</main></body>
</html>
