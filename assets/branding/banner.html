<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tactus banner source</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#121212;color:#e0e0e0}
.banner{position:relative;width:1200px;height:400px;overflow:hidden;background:#121212;display:flex;align-items:center;padding:0 74px;gap:30px}
.banner:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 149px,#ffffff07 149px 150px)}
.logo{position:relative;width:152px;height:152px}.lockup{position:relative}
.resonance{position:absolute;inset:0;width:1200px;height:400px;pointer-events:none}
.name{font:500 96px/1 'Outfit',sans-serif;letter-spacing:-.055em}
.description{font:400 22px/1.5 'Outfit',sans-serif;color:#b8b8b8;margin-top:16px;letter-spacing:.01em}
.support{font:400 16px/1.5 'Outfit',sans-serif;color:#999;margin-top:5px;letter-spacing:.01em}
.beats{position:absolute;bottom:32px;left:74px;right:74px;display:flex;justify-content:space-between;font:400 11px 'IBM Plex Mono',monospace;color:#626262}.beats span:first-child{color:#ffd700}
</style>
</head>
<body><main class="banner" aria-label="Tactus: Produce music with code. Built for agents. Arrange, render, analyze, and refine.">
<svg class="resonance" viewBox="0 0 1200 400" fill="none" aria-hidden="true">
  <path d="M720 182H1200M1040 0V400" stroke="#2A2A2A"/>
  <g stroke="#343434">
    <circle cx="1040" cy="182" r="98"/>
    <circle cx="1040" cy="182" r="280"/>
    <circle cx="1040" cy="182" r="336"/>
  </g>
  <circle cx="1040" cy="182" r="148" stroke="#FFD700" stroke-width="12" stroke-dasharray="650 280" transform="rotate(-26 1040 182)"/>
  <circle cx="1040" cy="182" r="220" stroke="#FFD700" stroke-opacity=".65" stroke-width="6" stroke-dasharray="905 478" transform="rotate(-5 1040 182)"/>
  <circle cx="1040" cy="182" r="280" stroke="#4DB6AC" stroke-opacity=".5" stroke-dasharray="270 1490" transform="rotate(140 1040 182)"/>
  <circle cx="1040" cy="182" r="15" fill="#FFD700"/>
  <circle cx="784" cy="69" r="4" fill="#4DB6AC"/>
  <circle cx="829" cy="244" r="5" fill="#FFD700"/>
</svg>
<img class="logo" src="tactus-logo.svg" alt="Tactus logo" width="152" height="152">
<div class="lockup"><div class="name">tactus</div><div class="description">Produce music with code. Built for agents.</div><div class="support">Arrange, render, analyze, and refine.</div></div>
<div class="beats" aria-hidden="true"><span>01</span><span>02</span><span>03</span><span>04</span><span>05</span><span>06</span><span>07</span><span>08</span></div>
</main></body>
</html>
